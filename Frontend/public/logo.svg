<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Amber to Orange-Gold -->
    <linearGradient id="hireiq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Subtle Inner Glow Highlight -->
    <linearGradient id="hireiq-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Sparkle Accent Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#78350F" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#hireiq-bg)" filter="url(#shadow)" />
  
  <!-- Subtle Top Highlight / Rim -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#hireiq-glow)" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Modern Geometric "H" Letterform -->
  <g fill="#FFFFFF">
    <!-- Left Pillar -->
    <rect x="136" y="128" width="60" height="256" rx="20" />
    
    <!-- Right Pillar -->
    <rect x="316" y="128" width="60" height="256" rx="20" />
    
    <!-- Dynamic Crossbar -->
    <rect x="136" y="226" width="240" height="60" rx="18" />
  </g>

  <!-- AI Intelligence Star Sparkle Accent -->
  <g transform="translate(366, 126)">
    <circle cx="0" cy="0" r="18" fill="url(#sparkle-grad)" />
    <circle cx="0" cy="0" r="28" fill="#FDE68A" opacity="0.4" />
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#FFFFFF" />
  </g>
</svg>
